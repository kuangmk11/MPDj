# Minimal MPD config for WSL. Copy to ~/.config/mpd/mpd.conf and set music_directory.
music_directory     "/mnt/CHANGE/ME/mp3"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"
log_file            "syslog"
bind_to_address     "localhost"
port                "6600"
auto_update         "no"     # inotify doesn't work on /mnt/* drives in WSL; run `mpc update`
restore_paused      "yes"

# WSLg provides a PulseAudio server that plays through Windows audio.
audio_output {
    type    "pulse"
    name    "WSLg"
    server  "unix:/mnt/wslg/PulseServer"
}
